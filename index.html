<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>SplitFit</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0b0b0c">
<style>
:root{color-scheme:dark;--bg:#0b0b0c;--card:#141416;--card2:#1c1c1f;--tx:#f2f2f3;--mu:#8a8a92;--mu2:#4f4f56;--ac:#e5202e;--ac2:#ff5560;--bd:#26262a;--r:16px;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.32,.72,0,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(100px + env(safe-area-inset-bottom,0px))}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;min-width:0;outline:0;transition:border-color .2s,background .2s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
input[type=number]{-moz-appearance:textfield}input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
textarea{resize:vertical;min-height:64px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--ac);padding:0;flex:none}
h1,h2,h3{margin:0;letter-spacing:-.01em}
.mu{color:var(--mu);font-size:13px}.mu2{color:var(--mu2)}.c{text-align:center}.r{text-align:right}
.lb{color:var(--mu);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.row{display:flex;gap:8px;align-items:center}.wrap{flex-wrap:wrap}.f1{flex:1;min-width:0}.mt{margin-top:10px}.mt2{margin-top:16px}.gap4{gap:4px}
.hdr{display:flex;align-items:flex-end;gap:10px;margin:8px 0 16px}
.hdr h1{font-size:28px;font-weight:700;letter-spacing:-.025em;line-height:1.1;margin-top:6px}
.hdr .sub{color:var(--mu);font-size:13px;margin-top:4px}
.brand{font-size:10.5px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;display:flex;align-items:center;gap:8px;color:var(--mu)}
.brand:before{content:"";width:8px;height:8px;background:var(--ac);border-radius:1px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:10px}
.card h3{font-size:16px;font-weight:600}
.card.warn{border-color:rgba(229,32,46,.55);background:linear-gradient(180deg,rgba(229,32,46,.09),rgba(229,32,46,.02))}
.empty{color:var(--mu);font-size:14px;text-align:center;padding:22px 8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--ac);color:#fff;border:0;border-radius:13px;padding:13px 16px;font-weight:600;width:100%;transition:transform .18s var(--ease),opacity .2s}
.btn:active,.ib:active,.chip:active,.press:active{transform:scale(.965)}
.btn.ghost{background:var(--card2);border:1px solid var(--bd);color:var(--tx)}
.btn.sm{width:auto;padding:9px 13px;font-size:13.5px;border-radius:11px}
.btn[disabled]{opacity:.4}
.ib{flex:none;background:var(--card2);border:1px solid var(--bd);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;transition:transform .18s var(--ease),border-color .2s}
.ib svg,.btn svg{width:20px;height:20px}.ib[disabled]{opacity:.3}
.press{transition:transform .18s var(--ease)}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border:1px solid var(--bd);border-radius:999px;padding:6px 11px;font-size:13px;transition:transform .18s var(--ease),background .2s,border-color .2s;white-space:nowrap}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.chip.bad{border-color:rgba(229,32,46,.5);color:#ff7b84;background:rgba(229,32,46,.08)}
.chip.sm{padding:3px 8px;font-size:11.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.hs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}.hs::-webkit-scrollbar{display:none}
.fld{display:flex;flex-direction:column;gap:5px}.fld>span{font-size:11px;color:var(--mu);letter-spacing:.08em;text-transform:uppercase}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--card2);border:1px solid var(--bd);color:var(--mu);white-space:nowrap}
.badge.ac{background:var(--ac);border-color:var(--ac);color:#fff}.badge.red{color:#ff7b84;border-color:rgba(229,32,46,.5)}
.sep{height:1px;background:var(--bd);margin:12px 0}
.av{flex:none;width:42px;height:42px;border-radius:50%;background:var(--card2);border:1px solid var(--bd);display:grid;place-items:center;font-weight:600;font-size:14px;letter-spacing:.02em;position:relative}
.av.lg{width:64px;height:64px;font-size:22px}
.av.alert:after{content:"";position:absolute;right:-1px;top:-1px;width:11px;height:11px;border-radius:50%;background:var(--ac);border:2px solid var(--card);animation:pulse 2s infinite}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--bd);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;transition:opacity .2s}
.li:first-child{border-top:0}.li:active{opacity:.6}
.li .t{font-weight:600}.li .s{color:var(--mu);font-size:12.5px;margin-top:1px}
.chev{width:16px;height:16px;color:var(--mu2);flex:none}
.li>svg,.role>svg{width:18px;height:18px;color:var(--mu2);flex:none}.li .ic{width:28px;display:grid;place-items:center;flex:none}
/* tab bar */
#tabs .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px));background:rgba(11,11,12,.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--bd)}
.tabbar .in{display:flex;max-width:560px;margin:0 auto}
.tab{flex:1;background:none;border:0;color:var(--mu);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;position:relative;transition:color .25s}
.tab svg{width:23px;height:23px;transition:transform .4s var(--spring)}
.tab.on{color:var(--tx)}.tab.on svg{transform:translateY(-1px) scale(1.08)}
.tab.on:before{content:"";position:absolute;top:-4px;width:20px;height:2px;border-radius:2px;background:var(--ac);animation:grow .35s var(--spring)}
/* segmented */
.seg{position:relative;display:flex;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:3px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{position:relative;z-index:1;flex:1 0 auto;background:none;border:0;color:var(--mu);font-size:13.5px;padding:8px 12px;border-radius:9px;white-space:nowrap;transition:color .3s}
.seg button.on{color:#fff}
.seg>i{position:absolute;top:3px;bottom:3px;left:0;width:0;background:var(--ac);border-radius:9px;transition:transform .45s var(--spring),width .45s var(--spring)}
.seg.sm{display:inline-flex;margin:0}.seg.sm button{padding:6px 10px;font-size:12.5px}
/* animations */
@keyframes inR{from{opacity:0;transform:translateX(30px)}}
@keyframes inL{from{opacity:0;transform:translateX(-30px)}}
@keyframes inU{from{opacity:0;transform:translateY(10px)}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}}
@keyframes pop{0%{transform:scale(.5)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes fadeIn{from{opacity:0}}
@keyframes barUp{from{transform:scaleY(0)}}
@keyframes wL{from{opacity:0;transform:translateX(40px)}}@keyframes wR{from{opacity:0;transform:translateX(-40px)}}
.page.a-fwd{animation:inR .45s var(--ease)}.page.a-back{animation:inL .45s var(--ease)}.page.a-tab{animation:inU .35s var(--ease)}
.page[class*=" a-"] .st{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.fx{animation:inU .35s var(--ease)}
.wkL{animation:wL .4s var(--ease)}.wkR{animation:wR .4s var(--ease)}
/* sheet */
.sb{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;transition:opacity .35s}
.sb.on{opacity:1}
.sh{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:#111113;border:1px solid var(--bd);border-bottom:0;border-radius:22px 22px 0 0;max-height:93vh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .5s var(--spring);box-shadow:0 -20px 60px rgba(0,0,0,.5)}
.sh.on{transform:none}
.grab{padding:10px 0 6px;display:flex;justify-content:center;touch-action:none;cursor:grab;flex:none}.grab i{width:40px;height:4px;border-radius:2px;background:#3a3a40}
.sbody{overflow:auto;padding:2px 16px calc(20px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.sbody h2{font-size:21px;margin:2px 0 14px;font-weight:700}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-160%);background:#1d1d20;border:1px solid var(--bd);padding:11px 16px;border-radius:14px;z-index:70;transition:transform .5s var(--spring);font-size:14px;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast.on{transform:translate(-50%,0)}
.vbar{position:sticky;top:0;z-index:15;margin:-10px -16px 8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;background:var(--ac);color:#fff;font-size:13px;display:flex;align-items:center;gap:8px;animation:fadeIn .3s}
.vbar button{margin-left:auto;background:rgba(0,0,0,.25);border:0;border-radius:8px;padding:5px 10px;font-size:12.5px;color:#fff}
/* week */
.wkh{display:flex;align-items:flex-start;gap:10px}
.wkn{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1}
.wk{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 1fr;font-variant-numeric:tabular-nums;font-size:14.5px}
.wk .h{font-size:10px;color:var(--mu);letter-spacing:.1em;text-transform:uppercase;padding:0 6px 8px;text-align:right}
.wk .h:first-child{text-align:left}
.wr{display:contents;cursor:pointer}
.wr>div{padding:12px 6px;border-top:1px solid var(--bd);text-align:right;transition:background .2s;white-space:nowrap}
.wr>div:first-child{text-align:left}
.wr.today>div{background:rgba(229,32,46,.08)}.wr.today>div:first-child{box-shadow:inset 2px 0 var(--ac)}
.wr.fut{cursor:default}.wr.fut>div{color:var(--mu2)}
.wr.ft>div{color:var(--mu);font-size:13px;border-top:1px solid #333}
.wr .d small{color:var(--mu);font-size:11.5px;margin-left:3px}
.wr .mk{margin-left:4px;font-size:12px;letter-spacing:-1px}
.bad{color:var(--ac2)}.good{color:var(--tx)}
.dl{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-variant-numeric:tabular-nums;padding:4px 8px;border-radius:8px;background:var(--card2)}
.dl.bad{background:rgba(229,32,46,.12)}
/* day sheet */
.wbox{display:flex;align-items:center;gap:10px;justify-content:center;margin:2px 0 14px}
.wbox .ib{width:52px;height:52px;border-radius:16px;font-size:24px}
input.big{font-size:44px;font-weight:700;text-align:center;border:0;background:none;padding:0;width:170px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
input.big:focus{border:0}
.mks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mk-b{background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:8px 2px;font-size:11px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .18s var(--ease),border-color .2s,background .2s}
.mk-b b{font-size:19px;font-weight:400}
.mk-b.on{border-color:var(--ac);background:rgba(229,32,46,.12);color:var(--tx)}.mk-b.on b{animation:pop .35s var(--spring)}
.bub{max-width:85%;padding:9px 12px;border-radius:14px;background:var(--card2);font-size:14px;margin-top:6px;animation:inU .3s var(--ease)}
.bub.me{margin-left:auto;background:rgba(229,32,46,.18)}
.bub small{display:block;color:var(--mu);font-size:11px;margin-bottom:2px}
/* today */
.tdy{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tdy>div{background:var(--card2);border-radius:12px;padding:10px;position:relative;overflow:hidden}
.tdy b{display:block;font-size:19px;font-variant-numeric:tabular-nums;margin-top:2px}
.tdy .no b{color:var(--mu2);font-weight:500;font-size:15px}
.pbar{height:3px;border-radius:2px;background:#2a2a2f;margin-top:8px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--ac);transform-origin:left;animation:grow .9s var(--ease) both}
.quote{border-left:2px solid var(--ac);padding:2px 0 2px 10px;margin-top:12px;font-size:14px}
/* chart */
.chart{position:relative;user-select:none}
.chart svg{width:100%;display:block;overflow:visible;touch-action:pan-y}
.chart .tip{position:absolute;top:-6px;transform:translate(-50%,-100%);background:#222226;border:1px solid #333;border-radius:9px;padding:5px 9px;font-size:12px;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .15s}
.chart .tip.on{opacity:1}
.draw{transition:stroke-dashoffset 1.2s var(--ease)}
.bar-r{transform-box:fill-box;transform-origin:bottom;animation:barUp .7s var(--ease) both}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.stat{background:var(--card2);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums;margin-top:2px;letter-spacing:-.02em}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.kpi .card{margin:0}
.kpi b{display:block;font-size:26px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:4px}
.hb{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13.5px}
.hb .tr{flex:1;height:8px;border-radius:4px;background:var(--card2);position:relative;overflow:hidden}
.hb .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--ac);transform-origin:left;animation:grow .9s var(--ease) both}
.hb .tr u{position:absolute;top:0;bottom:0;background:rgba(229,32,46,.18)}
.spark{width:64px;height:24px;flex:none}
.heat{display:flex;gap:3px;flex:none}.heat i{width:7px;height:7px;border-radius:2px;background:#2a2a2f}.heat i.on{background:var(--tx)}.heat i.part{background:var(--mu2)}
/* workout */
.ex h3{font-size:16.5px}
.set{display:grid;grid-template-columns:20px 1fr auto 1fr 1.25fr 44px;gap:6px;align-items:center;margin-top:7px}
.set .n{color:var(--mu);font-size:13px}
.set input,.set select{padding:9px 6px;text-align:center}
.set select{text-align:left;padding:9px 4px;font-size:13px}
.chk{width:44px;height:42px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--mu);font-size:17px;transition:background .25s,border-color .25s,color .25s,transform .18s}
.set.done .chk{background:var(--ac);border-color:var(--ac);color:#fff;animation:pop .4s var(--spring)}
.set.done input,.set.done select{border-color:#3a1c1f}
#tm{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:30;max-width:536px;margin:0 auto;background:var(--ac);border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:8px;transform:translateY(calc(100% + 120px));opacity:0;pointer-events:none;transition:transform .5s var(--spring),opacity .3s;overflow:hidden;box-shadow:0 10px 40px rgba(229,32,46,.35)}
#tm.on{transform:none;opacity:1;pointer-events:auto}
#tm .p{position:absolute;left:0;top:0;bottom:0;background:rgba(0,0,0,.2);transition:width .25s linear}
#tm b{position:relative;font-size:26px;font-variant-numeric:tabular-nums;min-width:74px;text-align:center;flex:1}
#tm button{position:relative;background:rgba(0,0,0,.25);border:0;border-radius:10px;padding:9px 12px;color:#fff}
.it{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--bd);padding:12px 2px}
.it:active{opacity:.6}
.it{align-items:center}.it .tick{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--bd);flex:none;transition:background .2s,border-color .2s;position:relative}
.it.on .tick{background:var(--ac);border-color:var(--ac);animation:pop .3s var(--spring)}.it.on .tick:after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.it.on{color:var(--tx)}.pkfoot{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));margin:14px -16px 0;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(17,17,19,0),#111113 30%)}
.set.cset{grid-template-columns:20px 1fr 1fr 1.4fr 44px}.cset .lb{font-size:9.5px}
.exrow{border-top:1px solid var(--bd);padding-top:9px;margin-top:9px}.ib.sm{width:30px;height:30px;border-radius:9px;font-size:12px}
/* photos */
.cmp{position:relative;aspect-ratio:3/4.4;border-radius:16px;overflow:hidden;touch-action:pan-y;background:#151517;user-select:none}
.cmp img,.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.cmp .top{position:absolute;inset:0}
.cmp .hd{position:absolute;top:0;bottom:0;width:2px;background:#fff;transform:translateX(-1px);pointer-events:none}
.cmp .hd i{position:absolute;top:50%;left:50%;width:38px;height:38px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 4px 18px rgba(0,0,0,.4);display:grid;place-items:center;color:#111;font-style:normal;font-size:14px;font-weight:700}
.cmp .tg{position:absolute;bottom:10px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);border-radius:8px;padding:4px 8px;font-size:12px}
.ph{position:relative;aspect-ratio:3/4.4;border-radius:12px;overflow:hidden;background:var(--card2);border:1px solid var(--bd)}
.ph.add{display:grid;place-items:center;color:var(--mu);font-size:12px;text-align:center}
.ph .lab{position:absolute;left:6px;bottom:6px;font-size:10.5px;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:6px}
/* onboarding */
.ob{min-height:calc(100vh - 120px);display:flex;flex-direction:column;justify-content:center}
.logo{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.logo i{width:22px;height:22px;background:var(--ac);border-radius:3px;animation:pop .7s var(--spring) both}
.logo span{font-size:30px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;animation:inR .7s .15s var(--ease) both}
.role{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;margin-top:10px;transition:transform .2s var(--ease),border-color .2s}
.role:active{transform:scale(.98);border-color:var(--ac)}
.role .ic{width:46px;height:46px;border-radius:14px;background:rgba(229,32,46,.12);color:var(--ac);display:grid;place-items:center;flex:none}
.role .ic svg{width:24px;height:24px}
.role b{font-size:17px}
.tier{position:relative;display:flex;align-items:center;gap:12px;background:var(--card2);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-top:8px;width:100%;text-align:left;transition:transform .2s var(--ease),border-color .2s}
.tier.pop{border-color:var(--ac)}
.tier .pr{font-size:20px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.ring{transform:rotate(-90deg)}.ring circle{transition:stroke-dashoffset 1.1s var(--ease)}
.okc{width:84px;height:84px;margin:6px auto 10px;display:block}
.okc circle,.okc path{stroke:var(--ac);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.okc circle{stroke-dasharray:240;stroke-dashoffset:240;animation:dash .7s var(--ease) forwards}
.okc path{stroke-dasharray:60;stroke-dashoffset:60;animation:dash .45s .55s var(--ease) forwards}
@keyframes dash{to{stroke-dashoffset:0}}
@keyframes flash{0%{border-color:var(--ac);box-shadow:0 0 0 3px rgba(229,32,46,.35)}100%{border-color:var(--bd);box-shadow:none}}.flash{animation:flash 1.6s var(--ease)}

  if(LIVE)return bootLive();
  try{const s=JSON.parse(localStorage.getItem(LSK)||'null');if(s&&s.DB&&s.DB.v===1){DB=s.DB;ME=s.ME}}catch(e){}
  if(!DB){DB=genDemo();persist()}
  DB.custom=DB.custom||{};DB.tpl=DB.tpl||{};
  startUI()}
function startUI(){
  /* если тренировка не завершена (Telegram перезапустил приложение) — сразу возвращаем на неё */
  if(ME&&ME.role==='client'){const w=loadDraft(ME.id);/* клиентский черновик */if(w&&Object.values(w.sets||{}).some(x=>x.some(z=>z.ok))){UI.tab.client='workout';setTimeout(()=>toast('Продолжаем тренировку — отмеченные подходы на месте'),700)}}
  stack=[{s:ME?'root':'onboard'}];render('fwd');
  const sp=TG&&TG.initDataUnsafe&&TG.initDataUnsafe.start_param;
  if(sp&&sp.startsWith('inv_')&&(!ME||(ME.role==='client'&&!(C(ME.id)||{}).trainerId)))setTimeout(()=>signupClient(sp.slice(4)),400)}
async function bootLive(){
  if(!TG||!TG.initData){$('#app').replaceChildren(h('div',{className:'ob'},h('div',{className:'logo'},h('i'),h('span',{},APP.name)),h('div',{className:'mu',style:'font-size:15px'},'Откройте приложение в Telegram.'),h('a',{className:'btn mt2',href:'https://t.me/'+APP.bot,style:'text-decoration:none'},'Открыть @'+APP.bot)));return}
  $('#app').replaceChildren(loaderPage());
  try{await reloadMe()}catch(e){$('#app').replaceChildren(h('div',{className:'ob'},h('div',{className:'logo'},h('i'),h('span',{},APP.name)),h('div',{className:'card warn'},h('b',{},'Не удалось подключиться'),h('div',{className:'mu',style:'margin-top:4px'},e.message)),h('button',{className:'btn mt',onclick:bootLive},'Повторить')));return}
  startUI();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-lastLoad>60000&&!SH.length&&!AS&&!pending.size)reloadMe().then(()=>{if(stack[0].s==='root'||stack[0].s==='onboard')refresh()}).catch(()=>{})});
}
boot();
